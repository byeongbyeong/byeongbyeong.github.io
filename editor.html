<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SORI | 홈페이지 편집</title><link rel="stylesheet" href="editor.css?v=20261018"><script src="editor-template.js?v=20261018" defer></script><script src="editor.js?v=20261018" defer></script></head>
<body>
<header><a href="./index.html" class="brand">SORI <span>홈페이지 편집</span></a><span id="save-state" role="status">불러오는 중</span><div class="actions"><button id="undo" title="되돌리기" aria-label="되돌리기">↶</button><button id="redo" title="다시 실행" aria-label="다시 실행">↷</button><button id="import">불러오기</button><input type="file" id="import-file" accept="application/json,.json" hidden><button id="export" class="primary">변경 파일 내보내기</button></div></header>
<nav class="viewbar"><div class="segmented" aria-label="화면 크기"><button data-viewport="desktop" aria-pressed="true">PC</button><button data-viewport="mobile" aria-pressed="false">모바일</button></div><label class="check"><input id="pick" type="checkbox" checked>화면에서 선택</label><div class="segmented mode"><button data-mode="preview" aria-pressed="true">미리보기</button><button data-mode="inspector" aria-pressed="false">편집</button></div><button id="download-html">배포용 HTML</button></nav>
<main><aside class="sections"><h2>페이지 구성</h2><div id="sections"></div><button id="reset" class="danger">원본으로 초기화</button><a href="editor-guide.html" target="_blank" rel="noopener">저장·전달 안내 ↗</a></aside>
<section class="preview" aria-label="홈페이지 미리보기"><div id="frame-shell"><iframe id="preview" title="홈페이지 편집 미리보기" sandbox="allow-scripts allow-same-origin"></iframe></div></section>
<aside class="inspector"><div class="inspector-heading"><span class="eyebrow">선택한 요소</span><h2 id="selection-name">메인 화면</h2></div><div id="empty">수정할 글이나 사진을 선택해주세요.</div><div id="controls" hidden>
<label id="text-field">문구<textarea id="text" rows="5" maxlength="4000"></textarea></label>
<div id="image-fields" hidden><label class="upload">사진 교체<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="original-image">원래 사진으로</button><label>사진 설명<input id="alt" maxlength="300"></label><label>사진 맞춤<select id="fit"><option value="cover">영역 채우기</option><option value="contain">전체 사진 보기</option></select></label><label>가로 초점<input id="focus-x" type="range" min="0" max="100" value="50"></label><label>세로 초점<input id="focus-y" type="range" min="0" max="100" value="50"></label></div>
<div id="type-fields"><label>글자 크기 <output id="font-value"></output><input id="font-size" type="range" min="11" max="96"></label><div class="segmented" aria-label="글 정렬"><button data-align="left" title="왼쪽 정렬">왼쪽</button><button data-align="center" title="가운데 정렬">가운데</button><button data-align="right" title="오른쪽 정렬">오른쪽</button></div><label class="color-label">글자색<input id="color" type="color"></label><button id="reset-style">글자 스타일 복원</button></div>
<label>수정 의견<textarea id="feedback" rows="3" maxlength="2000" placeholder="이 위치에서 바꾸고 싶은 점"></textarea></label><label class="check"><input id="done" type="checkbox">의견 해결됨</label>
</div><div class="feedback-list"><h2>남긴 의견 <span id="feedback-count">0</span></h2><div id="feedback-list"></div></div><p class="privacy">이 브라우저의 초안 · 공개 사이트에는 미반영</p></aside></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-body"></p><div><button id="cancel-confirm">취소</button><button id="accept-confirm" class="primary">계속</button></div></dialog>
</body></html>
